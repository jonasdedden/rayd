[package]
name = "rayd-plasma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared-memory object store for rayd: memfd + mmap + SCM_RIGHTS fd handoff over UDS."

[lints]
workspace = true

[dependencies]
bincode.workspace = true
bytes.workspace = true
hex.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
prometheus.workspace = true
# `socket`+`uio` for the SCM_RIGHTS handoff; `fs` for `memfd_create`
# on Linux; `mman` for `shm_open`/`shm_unlink` on macOS (which lacks
# `memfd_create` and uses POSIX shm + immediate-unlink as the
# anonymous-fd substrate).
nix = { version = "0.29", features = ["socket", "uio", "fs", "mman"] }
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
